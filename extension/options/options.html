<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Fakeshop-Warner – Einstellungen</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 560px;
      margin: 30px auto;
      color: #202124;
      padding: 0 16px;
    }
    h1 { font-size: 18px; }
    label { font-weight: 600; font-size: 13px; display: block; margin-top: 16px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      margin-top: 4px;
    }
    .hint { font-size: 12px; color: #5f6368; margin-top: 4px; }
    button {
      margin-top: 14px;
      padding: 8px 16px;
      font-size: 13px;
      border: 1px solid #1a73e8;
      background: #1a73e8;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    #save-status { margin-left: 10px; font-size: 13px; color: #1e8e3e; }
    .box {
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 6px;
      padding: 12px;
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Fakeshop-Warner – Einstellungen</h1>

  <label for="remote-url">URL der gehosteten Fakeshop-Liste (JSON)</label>
  <input type="text" id="remote-url" placeholder="https://example.com/fakeshops.json" />
  <div class="hint">
    Leer lassen, um nur die im Extension-Paket mitgelieferte Liste zu verwenden.
    Die Liste wird automatisch zweimal täglich neu geladen.
  </div>

  <button id="save-btn">Speichern</button>
  <span id="save-status"></span>

  <div class="box" id="list-info"></div>
</body>
<script src="options.js"></script>
</html>
