<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Fakeshop-Warner</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      color: #202124;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    .status {
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .status.ok {
      background: #e6f4ea;
      color: #1e8e3e;
    }
    .status.warn {
      background: #fce8e6;
      color: #c5221f;
    }
    .status.unknown {
      background: #f1f3f4;
      color: #5f6368;
    }
    .meta {
      font-size: 12px;
      color: #5f6368;
      margin-top: 10px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #f8f9fa;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Fakeshop-Warner</h1>
  <div id="status" class="status unknown">Prüfe aktuelle Seite…</div>
  <button id="refresh-btn">Liste jetzt aktualisieren</button>
  <div class="meta" id="meta"></div>
  <div class="meta"><a href="../options/options.html" id="options-link">Einstellungen öffnen</a></div>
  <script src="popup.js"></script>
</body>
</html>
