name: Fakeshop-Liste aktualisieren

on:
  schedule:
    - cron: "17 4 * * *" # taeglich ca. 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencies installieren
        working-directory: scraper
        run: npm install

      - name: Scraper ausfuehren
        working-directory: scraper
        run: node scrape.js --out=../data/fakeshops.json

      - name: Bundled Fallback aktualisieren
        run: cp data/fakeshops.json extension/data/fakeshops.json

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fakeshops.json extension/data/fakeshops.json
          git diff --cached --quiet || git commit -m "Fakeshop-Liste automatisch aktualisiert"
          git push
